name: Build Colour Pulse APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/ColourPulse_v5.0.0_Beta1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColourPulse_v5.0.0_Beta1
          path: output/ColourPulse_v5.0.0_Beta1.apk
